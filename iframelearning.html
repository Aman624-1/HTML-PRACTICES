<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedding Youtube Video</title>
</head>
<body>
    <header>
        <h1>My First Iframe Page</h1>
        <p>Iframe tag is used to embedd a youtube video in a webpage.</p>
        <p>You do not need to switch to youtube while you are visiting a webpage.</p>
    </header>
    <hr>
    <main>
        <section>
            <h2>Video Player</h2>
            <iframe 
                width="500" 
                height="300" 
                src="https://www.youtube.com/embed/GMQGZjFn6-4?list=RDGMQGZjFn6-4" 
                title="छठ पूजा Chhath Pooja Special" 
                allowfullscreen>
            </iframe>

        </section>
    </main>
    <hr>
    <footer>
        <p>&copy; All rights are reserved</p>
    </footer>
</body>
</html>
